[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cruxial"
version = "0.5.4"
description = "The action layer for AI agents. Proof of what your agent actually did, not what it claimed: every tool call resolves from a receipt, so 'done' is evidence, not a guess."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Cruxial" }]
keywords = [
    "llm",
    "tool-calling",
    "function-calling",
    "agents",
    "openai",
    "anthropic",
    "reliability",
    "schema-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
# Define tools as Pydantic models; cruxial extracts their JSON Schema for
# validation. Adapter only — Pydantic is never required by the core.
pydantic = ["pydantic>=2"]
# Linear-time regex engine for `pattern` validation. Optional: without it,
# catastrophic-backtracking patterns are statically detected and skipped (never
# run) so they can't hang. With it, every pattern is matched in linear time.
re2 = ["google-re2>=1.1"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "openai>=1.40",
    "anthropic>=0.40",
    "mcp>=1.0",
    "pydantic>=2",
]

[project.scripts]
cruxial = "cruxial.cli:main"

[project.urls]
Homepage = "https://cruxial.ai"
Repository = "https://github.com/cruxial-ai/cruxial"
Issues = "https://github.com/cruxial-ai/cruxial/issues"

[tool.hatch.build.targets.wheel]
packages = ["cruxial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --tb=short"
asyncio_mode = "auto"
